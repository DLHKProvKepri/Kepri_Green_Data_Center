function ModulePage({ m, f, setF }){
  const [q, setQ] = useState("");
  const [page, setPage] = useState(0);
  const [sel, setSel] = useState(null);
  const srt = useSort({ k:"id", dir:1 });
  useEffect(() => { setQ(""); setPage(0); setSel(null); }, [m.id]);
  useEffect(() => { setPage(0); }, [sel]);
  const K = KAMUS[m.id], v = sel != null ? K[sel] : null;
  const inds = v ? v.ind : m.ind;
  const kabIds = f.kab === "all" ? WILAYAH.map(w => w.id) : [f.kab];
  const rows = srt.sort(RECORDS.filter(r => inds.includes(r.ind) && kabIds.includes(r.kab) && statusOk(r.status, f.status) && r.tahun === f.tahun)
    .filter(r => !q || (r.id + r.kabupaten_kota + r.nama_indikator).toLowerCase().includes(q.toLowerCase())), (r, k) => r[k]);
  const PER = 10, pages = Math.max(1, Math.ceil(rows.length / PER)), view = rows.slice(page*PER, page*PER + PER);
  const noData = v ? !v.ind.length : !m.ind.length;
  return (
    <>
      <PageHead crumb={`Beranda / Modul ${m.kode}`} title={m.nama} />
      <ModHero m={m} sel={sel} setSel={setSel} />
      <div style={{marginTop:16}}><FilterCard f={f} setF={setF} meta={noData ? "Belum ada data" : `${rows.length} rekaman${v ? ` · ${v.nama}` : ""}`}>
        <div className="field" style={{minWidth:210}}>
          <label htmlFor="fv">Variabel</label>
          <select id="fv" value={sel ?? ""} onChange={e => setSel(e.target.value === "" ? null : +e.target.value)}>
            <option value="">Semua variabel</option>
            {K.map((x, i) => <option key={x.nama} value={i}>{x.nama}{x.ind.length ? "" : " (belum ada data)"}</option>)}
          </select>
        </div>
        {!noData && <div className="field">
          <label htmlFor="q">Cari rekaman</label>
          <input id="q" placeholder="Kode, wilayah, indikator" value={q} onChange={e => { setQ(e.target.value); setPage(0); }} />
        </div>}
      </FilterCard></div>
      {noData ? (
        <div className="empty" style={{background:"var(--card)"}}>
          <b>{v ? `Belum ada data untuk “${v.nama}”` : "Belum ada data demo untuk modul ini"}</b>
          {v ? <>Data perlu disetor oleh pemilik data: {v.src}. Penanggung jawab di DLHK: {v.pj}.</>
            : m.prioritas ? "Daftar usaha/kegiatan dan hasil pengawasan dibangun pada tahap berikutnya. Pilih variabel di atas untuk melihat kamus datanya." : "Modul ini dijadwalkan setelah enam modul prioritas tahap 1 selesai. Pilih variabel di atas untuk melihat kamus datanya."}
        </div>
      ) : (
        <section className="card">
          <div className="card-h"><div><h3>Rekaman data{v ? `: ${v.nama}` : ""}</h3><div className="sub">Tahun {f.tahun} · data demo</div></div>
            {v && <div className="tools"><button className="btn sm" onClick={() => setSel(null)}>Tampilkan semua variabel</button></div>}</div>
          {rows.length === 0 ? <div className="empty"><b>Tidak ada rekaman yang cocok</b>Ubah kata kunci, tahun, atau status verifikasi.</div> : <>
            <div className="tbl"><table>
              <thead><tr>{srt.th("id","Kode")}{srt.th("nama_indikator","Indikator")}{srt.th("kabupaten_kota","Kabupaten/kota")}{srt.th("nilai","Nilai","r")}<th>Satuan</th>{srt.th("status","Status")}{srt.th("updated_at","Diperbarui")}</tr></thead>
              <tbody>{view.map(r => (
                <tr key={r.id}><td className="num" style={{color:"var(--muted)", whiteSpace:"nowrap"}}>{r.id}</td><td className="strong">{r.nama_indikator}{r.klasifikasi_akses === "terbatas" && <span className="tg tg-red" style={{marginLeft:6}}>Terbatas</span>}</td><td>{r.kabupaten_kota}</td>
                  <td className="r num strong">{fmtNum(r.nilai, IND[r.ind].dec)}</td><td style={{color:"var(--muted)"}}>{r.satuan}</td>
                  <td><span className={"tg " + STATUS_TAG[r.status]}>{STATUS[r.status].label}</span></td><td className="num" style={{whiteSpace:"nowrap"}}>{fmtTanggal(r.updated_at)}</td></tr>))}</tbody>
            </table></div>
            {pages > 1 && <div className="pager" style={{margin:"0 -18px -18px"}}>
              <button className="btn sm" disabled={page === 0} onClick={() => setPage(p => p - 1)}>Sebelumnya</button>
              <span>Halaman {page + 1} dari {pages}</span>
              <button className="btn sm" disabled={page >= pages - 1} onClick={() => setPage(p => p + 1)}>Berikutnya</button>
            </div>}
          </>}
        </section>
      )}
      <div className="note" style={{marginTop:16}}><b>Belum tersedia di tahap ini:</b> form tambah/ubah data, unggah lampiran, inbox verifikasi, dan audit log.</div>
    </>
  );
}

/* ---------- M11 Pengaduan (JAGA KEPRI) ---------- */
let JAGA_HTML = null;
function jagaHtml(){
  if (JAGA_HTML) return JAGA_HTML;
  const b64 = document.getElementById("jaga-src").textContent.trim();
  JAGA_HTML = new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
  return JAGA_HTML;
}

function PengaduanPage({ m, f, setF }){
  const [tab, setTab] = useState("ringkasan");
  const [loaded, setLoaded] = useState(false);
  const [full, setFull] = useState(false);
  const [yr, setYr] = useState(JAGA_TAHUN.includes(f.tahun) ? f.tahun : JAGA_TAHUN[JAGA_TAHUN.length-1]);
  const frameRef = useRef(null);
  const ws = useSort({ k:"total", dir:-1 });
  const [sel, setSel] = useState(null);
  const [more, setMore] = useState(false);
  useEffect(() => { if (tab === "aplikasi") setLoaded(true); }, [tab]);
  useEffect(() => { window.__jagaFrame = frameRef.current; });
  useEffect(() => { if (!full) return; const k = e => { if (e.key === "Escape") setFull(false); }; window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, [full]);

  const S = JAGA.STAT_DATA[yr], P = JAGA.STAT_DATA[yr - 1];
  const aktif = S.total - S.selesai - S.diteruskan;
  const avgHari = S.bulanan.reduce((a, b) => a + parseFloat(b.avgHari), 0) / S.bulanan.length;
  const wil = S.perwilayah.map(w => ({ ...w, id:JAGA_WIL[w.wil], nama:WMAP[JAGA_WIL[w.wil]].nama, aktif:w.total - w.selesai - w.terus, pct:w.selesai / w.total * 100 }));
  const ch = (a, b, lowerBetter) => { if (b == null) return null; const d = (a - b) / b * 100; return <span className={"chip " + (Math.abs(d) < .05 ? "flat" : (lowerBetter ? d < 0 : d > 0) ? "good" : "bad")}>{d >= 0 ? "+" : "−"}{fmtNum(Math.abs(d), 0)}%</span>; };
  const cards = [
    { l:"Aduan masuk", v:fmtNum(S.total), icon:"megaphone", c:"var(--amber)", bg:"var(--amber-bg)", chip: P && ch(S.total, P.total), f: P ? `vs ${yr-1}` : "" },
    { l:"Selesai", v:fmtNum(S.selesai), icon:"check", c:"var(--pri-d)", bg:"var(--pri-soft)", chip: <span className="chip info">{fmtNum(S.selesai / S.total * 100, 0)}%</span>, f:"dari aduan masuk" },
    { l:"Diteruskan", v:fmtNum(S.diteruskan), icon:"layers", c:"var(--violet)", bg:"var(--violet-bg)", f:"Di luar kewenangan DLHK Provinsi" },
    { l:"Aktif", v:fmtNum(aktif), icon:"bell", c:"var(--red)", bg:"var(--red-bg)", f:`${S.baru} baru · ${S.proses} dalam proses` },
    { l:"Lingkungan hidup : kehutanan", v:`${S.lh} : ${S.hut}`, icon:"leaf", c:"var(--blue)", bg:"var(--blue-bg)", f:"Kategori hasil pemilahan sistem" },
    { l:"Rata-rata penyelesaian", v:<>{fmtNum(avgHari, 1)}<small>hari</small></>, icon:"chart", c:"#0E7C86", bg:"var(--blue-bg)", f:"Rerata bulanan" },
  ];

  return (
    <>
      <PageHead crumb="Beranda / Modul M11" title={m.nama}>
        <div className="seg" role="tablist" style={{padding:4}}>
          <button role="tab" aria-pressed={tab === "ringkasan"} aria-selected={tab === "ringkasan"} onClick={() => setTab("ringkasan")} style={{padding:"8px 16px", fontSize:13}}>Ringkasan data</button>
          <button role="tab" aria-pressed={tab === "aplikasi"} aria-selected={tab === "aplikasi"} onClick={() => setTab("aplikasi")} style={{padding:"8px 16px", fontSize:13}}>Aplikasi JAGA KEPRI</button>
        </div>
      </PageHead>
      <ModHero m={m} sel={sel} setSel={setSel} extraTags={<span className="tg tg-blue">Subsistem: JAGA KEPRI v8</span>}>
        <div className="flow" aria-label="Alur data pengaduan">
          <span className="box">Warga mengirim aduan</span><span className="arr">→</span>
          <span className="box">Telaah dan disposisi petugas</span><span className="arr">→</span>
          <span className="box">Rekap tanpa identitas pelapor</span><span className="arr">→</span>
          <span className="box">Dashboard Pimpinan dan peta</span>
        </div>
      </ModHero>

      <div style={{display: tab === "ringkasan" ? "block" : "none", marginTop:16}}>
        <FilterCard f={{ ...f, tahun:yr }} setF={nf => { if (nf.tahun !== yr) setYr(nf.tahun); if (nf.kab !== f.kab) setF({ ...f, kab:nf.kab }); }} years={JAGA_TAHUN} hideStatus title="Filter rekap pengaduan"
          meta={`Data contoh JAGA KEPRI v8${yr === 2026 ? ` · 2026 sampai ${S.bulanan[S.bulanan.length-1].bln}` : ""}`} />
        <section className="grid g-kpi">
          {cards.map(c => (
            <div className="kpi" key={c.l}>
              <div className="kpi-top"><span className="kpi-ic" style={{background:c.bg, color:c.c}}><Icon name={c.icon} size={16} /></span><span className="kpi-l">{c.l}</span><span className="tag-demo">DEMO</span></div>
              <div className="kpi-mid"><div className="kpi-v num">{c.v}</div>{c.chip}</div>
              <div className="kpi-f">{c.f}</div>
            </div>
          ))}
        </section>
        <div className="grid g-21">
          <section className="card">
            <div className="card-h"><div><h3>Aduan per bulan {yr}</h3><div className="sub">Masuk, selesai, dan diteruskan</div></div></div>
            <AreaChart labels={S.bulanan.map(b => b.bln)} unit="aduan" series={[
              { label:"Masuk", color:PALETTE[0], values:S.bulanan.map(b => b.masuk) },
              { label:"Selesai", color:PALETTE[1], values:S.bulanan.map(b => b.selesai) },
              { label:"Diteruskan", color:PALETTE[2], values:S.bulanan.map(b => b.terus) },
            ]} />
          </section>
          <section className="card">
            <div className="card-h"><div><h3>Status penyelesaian</h3><div className="sub">Tahun {yr}</div></div></div>
            <Donut sub="aduan" items={[
              { key:"s", label:"Selesai", color:"#2E9E5B", value:S.selesai }, { key:"t", label:"Diteruskan", color:"#6D5BD0", value:S.diteruskan },
              { key:"p", label:"Dalam proses", color:"#F0A040", value:S.proses }, { key:"b", label:"Baru", color:"#2563A8", value:S.baru },
            ]} />
          </section>
        </div>
        <div style={{display:"flex", justifyContent:"center", marginTop:16}}>
          <button className="btn" onClick={() => setMore(m => !m)} aria-expanded={more}>{more ? "Sembunyikan rincian" : "Lihat rincian: peta, rekap wilayah, instansi, dan aduan terbaru ›"}</button>
        </div>
        {more && <>
        <div className="grid g-11">
          <section className="card">
            <div className="card-h"><div><h3>Sebaran aduan aktif</h3><div className="sub">Klik wilayah untuk menyorot</div></div></div>
            <KepriMap title="Aduan aktif" sub={`${yr} · aduan · DATA CONTOH`} valueFor={id => (wil.find(w => w.id === id) || {}).aktif ?? null}
              fmt={v => `${fmtNum(v)} aduan aktif`} ramp={RAMP_PRIO} selected={f.kab} onSelect={k => setF({ ...f, kab:k })} height={420} />
          </section>
          <section className="card">
            <div className="card-h"><div><h3>Rekap per kabupaten/kota</h3><div className="sub">Tahun {yr}</div></div></div>
            <div className="tbl"><table style={{minWidth:0}}>
              <thead><tr>{ws.th("nama","Kabupaten/kota")}{ws.th("total","Total","r")}{ws.th("lh","LH","r")}{ws.th("hut","Hutan","r")}{ws.th("aktif","Aktif","r")}{ws.th("pct","Selesai","r")}</tr></thead>
              <tbody>{ws.sort(wil, (r, k) => r[k]).map(w => (
                <tr key={w.wil} className={"click" + (f.kab === w.id ? " sel" : "")} onClick={() => setF({ ...f, kab: f.kab === w.id ? "all" : w.id })}>
                  <td className="strong">{w.nama}</td><td className="r num strong">{w.total}</td><td className="r num">{w.lh}</td><td className="r num">{w.hut}</td>
                  <td className="r">{w.aktif ? <span className="tg tg-amber">{w.aktif}</span> : <span className="tg tg-grey">0</span>}</td>
                  <td className="r"><span className="bar-mini"><i><b style={{width:`${w.pct}%`}} /></i><span className="num">{fmtNum(w.pct, 0)}%</span></span></td>
                </tr>))}</tbody>
            </table></div>
          </section>
        </div>
        <div className="grid g-11">
          <section className="card">
            <div className="card-h"><div><h3>Aduan diteruskan ke instansi lain</h3><div className="sub">Tahun {yr}</div></div></div>
            <div className="tbl"><table style={{minWidth:0}}>
              <thead><tr><th>Instansi tujuan</th><th className="r">Jumlah</th><th>Dasar penerusan</th></tr></thead>
              <tbody>{(S.instansi || []).map(i => <tr key={i.inst}><td className="strong">{i.inst}</td><td className="r num">{i.jml}</td><td style={{color:"var(--muted)"}}>{i.dasar}</td></tr>)}</tbody>
            </table></div>
          </section>
          <section className="card">
            <div className="card-h"><div><h3>Aduan terbaru</h3><div className="sub">Identitas dan kontak pelapor tidak dikirim ke Data Center</div></div></div>
            <div className="tbl"><table style={{minWidth:0}}>
              <thead><tr><th>Tiket</th><th>Situasi</th><th>Lokasi</th><th>Status</th></tr></thead>
              <tbody>{JAGA.sampleRows.map(r => (
                <tr key={r.tkt}><td className="num" style={{whiteSpace:"nowrap", color:"var(--muted)"}}>{r.tkt}<br/><span style={{fontSize:11.5}}>{r.tgl}</span></td>
                  <td className="strong">{r.sit}<br/><span className={"tg " + (r.cat === "Kehutanan" ? "tg-green" : "tg-blue")} style={{marginTop:4}}>{r.cat}</span></td><td>{r.loc}</td>
                  <td><span className={"tg " + ({Baru:"tg-blue", Proses:"tg-amber", Selesai:"tg-green", Diteruskan:"tg-violet"}[r.st])}>{r.st === "Proses" ? "Dalam proses" : r.st}</span></td></tr>))}</tbody>
            </table></div>
          </section>
        </div>
        </>}
      </div>

      <div style={{display: tab === "aplikasi" ? "block" : "none", marginTop:16}}>
        <div className="note warn" style={{marginBottom:14, display:"flex", gap:12, alignItems:"center", flexWrap:"wrap"}}>
          <span style={{flex:1, minWidth:240}}>Aplikasi JAGA KEPRI berjalan di dalam Data Center. Email notifikasi dan pengiriman data pelapor (NIK, foto KTP) dinonaktifkan di prototipe. Akun petugas demo ada di halaman masuk petugas.</span>
          <button className="btn pri" onClick={() => setFull(true)}><Icon name="max" size={16} />Buka layar penuh</button>
        </div>
        <div className={full ? "jaga-full" : ""}>
          {full && <div className="jbar"><b style={{flex:1}}>JAGA KEPRI · Sistem Pengaduan</b><button className="btn sm" onClick={() => setFull(false)}><Icon name="close" size={15} />Tutup layar penuh</button></div>}
          {loaded && <iframe ref={frameRef} className="jaga-frame" title="Aplikasi JAGA KEPRI — Sistem Pengaduan" srcDoc={jagaHtml()} />}
        </div>
      </div>
    </>
  );
}

/* =========================================================
   13. APP SHELL
   ========================================================= */
/* =========================================================
   HALAMAN DEPAN (BERANDA) — desain landing page dari DLHK
   Gambar ada di window.KGDC_LANDING (WebP base64). Area klik transparan
   ditempatkan di atas tombol/kartu pada gambar; koordinat dalam piksel
   gambar asli 1672 × 941. Ubah "to" untuk mengganti tujuan tiap kartu.
   ========================================================= */
const LANDING_W = 1672, LANDING_H = 941;
const LANDING_LINKS = [
  { label:"Masuk ke Sistem",        to:"dashboard", box:[432,684,397,76],  pill:true },
  { label:"Data Lingkungan",        to:"m03",       box:[227,524,148,124] },
  { label:"Data Kehutanan",         to:"m01",       box:[389,524,148,124] },
  { label:"Informasi Program",      to:"m12",       box:[550,524,148,124] },
  { label:"Informasi Dokumen",      to:"m06",       box:[712,524,149,124] },
  { label:"Analisis dan Dashboard", to:"dashboard", box:[876,524,165,124] },
];
function Beranda({ go }){
  const pct = (v, total) => (v / total * 100).toFixed(3) + "%";
  const name = (id) => { const m = MODULES.find(x => x.id === id); return m ? m.nama : "Dashboard Pimpinan"; };
  return (
    <div className="lp">
      <div className="lp-hero">
        <img src={window.KGDC_LANDING} alt="KEPRI GREEN DATA CENTER, Pusat Data dan Informasi Lingkungan Hidup dan Kehutanan Provinsi Kepulauan Riau. Menu: Data Lingkungan, Data Kehutanan, Informasi Program, Informasi Dokumen, Analisis dan Dashboard." />
        {LANDING_LINKS.map(l => (
          <button key={l.label} type="button" className={"lp-hot" + (l.pill ? " pill" : "")} onClick={() => go(l.to)}
            aria-label={l.pill ? "Masuk ke sistem" : l.label + ", buka " + name(l.to)} title={l.pill ? "Masuk ke sistem" : l.label}
            style={{ left:pct(l.box[0], LANDING_W), top:pct(l.box[1], LANDING_H), width:pct(l.box[2], LANDING_W), height:pct(l.box[3], LANDING_H) }} />
        ))}
      </div>
      <div className="lp-quick">
        <button type="button" className="btn pri" onClick={() => go("dashboard")}>Masuk ke Sistem<Icon name="chev" size={18} /></button>
        <div className="row">
          {LANDING_LINKS.filter(l => !l.pill).map(l => <button key={l.label} type="button" className="btn sm" onClick={() => go(l.to)}>{l.label}</button>)}
        </div>
      </div>
      <p className="foot">KEPRI GREEN DATA CENTER — Sistem Informasi Lingkungan Hidup dan Kehutanan Provinsi Kepulauan Riau. Seluruh angka pada prototipe ini adalah hasil simulasi dan tidak menggambarkan kondisi lingkungan Kepulauan Riau.</p>
    </div>
  );
}

const ROUTES = ["beranda","dashboard","peta", ...MODULES.map(m => m.id)];
const readHash = () => { const h = (location.hash || "").slice(1); return ROUTES.includes(h) ? h : "beranda"; };
const SEARCH_ITEMS = [
  { id:"beranda", k:"", t:"Beranda", s:"halaman depan landing masuk sistem" },
  { id:"dashboard", k:"", t:"Dashboard Pimpinan", s:"kpi ringkasan grafik" },
  { id:"peta", k:"", t:"Peta Tematik", s:"gis peta lapisan prioritas" },
  ...MODULES.map(m => ({ id:m.id, k:m.kode, t:m.nama, s:(m.vars.join(" ") + " " + m.desc) })),
];

function App(){
  const [route, setRoute] = useState(readHash());
  const [f, setF] = useState({ tahun:2024, kab:"all", status:"terverifikasi" });
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const [qOpen, setQOpen] = useState(false);
  const [bell, setBell] = useState(false);
  const [msg, setMsg] = useState(null);
  const tRef = useRef(), bellRef = useRef(), searchRef = useRef();
  const toast = (t) => { setMsg(t); clearTimeout(tRef.current); tRef.current = setTimeout(() => setMsg(null), 3800); };

  useEffect(() => { const on = () => { setRoute(readHash()); setOpen(false); window.scrollTo(0,0); }; window.addEventListener("hashchange", on); return () => window.removeEventListener("hashchange", on); }, []);
  useEffect(() => { const k = e => { if (e.key === "Escape"){ setOpen(false); setBell(false); setQOpen(false); } }; window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, []);
  useEffect(() => { const c = e => { if (bellRef.current && !bellRef.current.contains(e.target)) setBell(false); if (searchRef.current && !searchRef.current.contains(e.target)) setQOpen(false); }; document.addEventListener("pointerdown", c); return () => document.removeEventListener("pointerdown", c); }, []);
  useEffect(() => {
    const on = async (e) => {
      const d = e.data; if (!d || d.kgdc !== 1 || !window.__jagaFrame || e.source !== window.__jagaFrame.contentWindow) return;
      if (d.type === "toast") toast(d.text);
      if (d.type === "save" && typeof d.filename === "string" && typeof d.data === "string") saveFile(d.filename, d.data, toast);
    };
    window.addEventListener("message", on); return () => window.removeEventListener("message", on);
  }, []);

  const go = (r) => { setQ(""); setQOpen(false); setBell(false); if (location.hash.slice(1) === r) { setOpen(false); return; } location.hash = r; };
  const mod = MODULES.find(m => m.id === route);
  const hits = q.trim() ? SEARCH_ITEMS.filter(i => (i.k + " " + i.t + " " + i.s).toLowerCase().includes(q.trim().toLowerCase())).slice(0, 8) : [];
  const today = new Date().toISOString().slice(0,10);
  const lewat = TINDAK.filter(t => t.tenggat < today);
  const baru = JAGA.sampleRows.filter(r => r.st === "Baru");
  const nNotif = lewat.length + baru.length;

  const Item = ({ id, icon, label, code, prio }) => (
    <li><button aria-current={route === id ? "page" : undefined} onClick={() => go(id)}>
      <Icon name={icon} size={19} />{code && <span className="code">{code}</span>}<span className="txt">{label}</span>{prio !== undefined && <span className={"sb-dot" + (prio ? "" : " next")} title={prio ? "Prioritas tahap 1" : "Tahap berikutnya"} />}
    </button></li>
  );

  if (route === "beranda") return (
    <>
      <div className="demo-strip" role="note"><b>DATA DEMO / SIMULASI — BUKAN DATA RESMI</b> · Prototipe tahap 1, bukan sistem resmi DLHK Kepri</div>
      <Beranda go={go} />
      {msg && <div className="toast" role="status">{msg}</div>}
    </>
  );

  return (
    <>
      <header className="topbar">
        <button className="tb-icon burger" onClick={() => setOpen(true)} aria-label="Buka menu"><Icon name="menu" size={19} /></button>
        <div className="tb-brand" role="link" tabIndex={0} title="Ke halaman Beranda" onClick={() => go("beranda")} onKeyDown={e => { if (e.key === "Enter") go("beranda"); }}>
          <span className="tb-logo-img"><img src={LOGO_DLHK} alt="Logo Dinas Lingkungan Hidup dan Kehutanan Provinsi Kepulauan Riau" /></span><span className="tb-div" aria-hidden="true" />
          <div style={{minWidth:0}}>
            <div className="tb-name">KEPRI GREEN DATA CENTER</div>
            <div className="tb-sub">Sistem Informasi Lingkungan Hidup dan Kehutanan Provinsi Kepulauan Riau</div>
          </div>
        </div>
        <div className="tb-search" ref={searchRef}>
          <Icon name="search" size={17} />
          <input placeholder="Cari modul atau variabel" value={q} onChange={e => { setQ(e.target.value); setQOpen(true); }} onFocus={() => setQOpen(true)}
            onKeyDown={e => { if (e.key === "Enter" && hits[0]) go(hits[0].id); }} aria-label="Cari modul atau variabel" />
          {qOpen && q.trim() && <div className="tb-results" role="listbox">
            {hits.length ? hits.map((h, i) => <button key={h.id} className={i === 0 ? "on" : ""} onClick={() => go(h.id)}><span className="k">{h.k || "—"}</span>{h.t}</button>)
              : <div style={{padding:"10px 12px", fontSize:13, color:"var(--muted)"}}>Tidak ada modul yang cocok dengan “{q}”.</div>}
          </div>}
        </div>
        <div style={{position:"relative"}} ref={bellRef}>
          <button className="tb-icon" onClick={() => setBell(b => !b)} aria-label={`Notifikasi, ${nNotif} butuh perhatian`} aria-expanded={bell}>
            <Icon name="bell" size={19} />{nNotif > 0 && <span className="badge">{nNotif}</span>}
          </button>
          {bell && <div className="pop" role="dialog" aria-label="Notifikasi">
            <h4>Butuh perhatian (demo)</h4>
            {baru.length > 0 && <div className="it" style={{cursor:"pointer"}} onClick={() => go("m11")}><span className="tg tg-blue">Aduan</span><span>{baru.length} aduan baru menunggu telaah di JAGA KEPRI</span></div>}
            {lewat.map(t => <div className="it" key={t.kode}><span className="tg tg-red">Lewat</span><span>{t.uraian} · {WMAP[t.kab].singkat}</span></div>)}
            {nNotif === 0 && <div className="it">Tidak ada yang perlu ditindaklanjuti.</div>}
          </div>}
        </div>
        <div className="tb-user">
          <div className="who"><div className="n">Pimpinan</div><div className="r">Simulasi, tanpa login</div></div>
          <div className="tb-avatar" aria-hidden="true">PD</div>
        </div>
      </header>
      <div className="demo-strip" role="note"><b>DATA DEMO / SIMULASI — BUKAN DATA RESMI</b> · Prototipe tahap 1, bukan sistem resmi DLHK Kepri</div>

      <div className="shell">
        <div className={"scrim" + (open ? " show" : "")} onClick={() => setOpen(false)} />
        <nav className={"sidebar" + (open ? " open" : "")} aria-label="Navigasi utama">
          <div className="sb-group">Utama</div>
          <ul className="sb-list">
            <Item id="beranda" icon="bridge" label="Beranda" />
            <Item id="dashboard" icon="home" label="Dashboard Pimpinan" />
            <Item id="peta" icon="map" label="Peta Tematik" />
          </ul>
          <div className="sb-group">Modul data</div>
          <ul className="sb-list">{MODULES.map(m => <Item key={m.id} id={m.id} icon={m.ikon} code={m.kode} label={m.nama} prio={m.prioritas} />)}</ul>
          <div className="sb-legend"><span><i className="sb-dot" />Prioritas</span><span><i className="sb-dot next" />Berikutnya</span></div>
          <div className="sb-foot"><b>Prototipe tahap 1</b><br/>Data simulasi · {fmtTanggal(today)}</div>
        </nav>

        <main className="main">
          {route === "dashboard" && <Dashboard f={f} setF={setF} toast={toast} />}
          {route === "peta" && <PetaPage f={f} setF={setF} />}
          {mod && mod.id !== "m11" && <ModulePage m={mod} f={f} setF={setF} />}
          {mod && mod.id === "m11" && <PengaduanPage m={mod} f={f} setF={setF} />}
          <p className="foot">KEPRI GREEN DATA CENTER — Sistem Informasi Lingkungan Hidup dan Kehutanan Provinsi Kepulauan Riau. Seluruh angka pada prototipe ini adalah hasil simulasi dan tidak menggambarkan kondisi lingkungan Kepulauan Riau.</p>
        </main>
      </div>
      {msg && <div className="toast" role="status">{msg}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
